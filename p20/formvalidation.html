<!DOCTYPE html>
<html>
<head>
<title>Form validation</title>
</head>
<body>
<form onSubmit="return validateForm()">
<label>Name:</label>
<input type="text" id="name"><br><br>

<label>Email:</label>
<input type="email" id="email"><br><br>

<label>Number:</label>
<input type="text" id="number"><br><br>

<label>Password:</label>
<input type="password" id="password"><br><br>

<label>confirm password:</label>
<input type="password" id="cnfmPassword"><br><br>

<input type="submit" value="register">
</form>
<script>
function validateForm(){
  let name = document.getElementById('name').value
  let email = document.getElementById('email').value
  let number = document.getElementById('number').value
  let password = document.getElementById('password').value
  let cnfmPassword = document.getElementById('cnfmPassword').value

  if(name === "" || email === "" || number === "" || password === "" || cnfmPassword === ""){
    alert("Please fill complete credentials");
    return false
  }

  if(!email.includes("@") || !email.includes(".")){
    alert("Enter valid mail id")
    return false
  }
  
  if(number.length != 10 || isNaN(number)){
    alert("Enter valid number")
    return false
  }

  if(password.length < 6){
   alert("Enter stronger password")
   return false
  }
  
  if(password !== cnfmPassword){
    alert("Password does not match")
    return false
  }

  alert("Registration succesfull")
  return true
}
</script>
</body>
</html>
