<!DOCTYPE html>
<html>
<head>
<title>Text color change</title>
</head>
<body>
<h2 id="txt">Wello world</h2>
<button id="btn">Change Color</button>
<script>

const txt = document.getElementById("txt");

document.getElementById("btn").addEventListener(('click'),()=>{
  txt.style.color = "red"
})


</script>
</body>
</html>
